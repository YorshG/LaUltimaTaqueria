name: M3 Runtime Bot

on:
  pull_request:
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "data/content/**"
      - "tests/m3_runtime_bot.gd"
      - ".github/workflows/m3-runtime-bot.yml"
  push:
    branches:
      - "uat"

jobs:
  runtime-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        run: godot --version

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Run M3 runtime bot
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/m3-runtime-bot.log
          godot --headless --path . --script res://tests/m3_runtime_bot.gd -- 20 2>&1 | tee "$log"
          if grep -Eq 'SCRIPT ERROR|Parse Error|^[[:space:]]*ERROR:|leaked at exit|still in use at exit' "$log"; then
            echo "Unexpected engine error/leak in runtime bot"
            exit 1
          fi
          grep -q "M3 RUNTIME BOT PASS" "$log"

      - name: Run M3 runtime bot with restart coverage
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/m3-runtime-bot-restart.log
          godot --headless --path . --script res://tests/m3_runtime_bot.gd -- 20 restart 2>&1 | tee "$log"
          if grep -Eq 'SCRIPT ERROR|Parse Error|^[[:space:]]*ERROR:|leaked at exit|still in use at exit' "$log"; then
            echo "Unexpected engine error/leak in restart runtime bot"
            exit 1
          fi
          grep -q "M3 RUNTIME BOT PASS" "$log"
