name: Godot CI

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "tests/**"
      - "data/content/**"
      - ".github/workflows/godot-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        run: godot --version

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Run bootstrap scene headlessly
        run: godot --headless --path . --scene res://scenes/Main.tscn --quit-after 3

      - name: Validate content registry
        run: godot --headless --path . --script res://tests/content_registry_test.gd

      - name: Run recipe resolver tests
        run: godot --headless --path . --script res://tests/recipe_resolver_test.gd

      - name: Run lane tests
        run: |
          godot --headless --path . --script res://tests/lane_field_test.gd
          godot --headless --path . --script res://tests/monster_state_test.gd
          godot --headless --path . --script res://tests/lane_targeting_test.gd
          godot --headless --path . --script res://tests/lane_integration_test.gd

      - name: Run wave director tests
        run: godot --headless --path . --script res://tests/wave_director_test.gd

      - name: Run upgrade selector tests
        run: |
          godot --headless --path . --script res://tests/upgrade_selector_test.gd
          godot --headless --path . --script res://tests/upgrade_selector_integration_test.gd
