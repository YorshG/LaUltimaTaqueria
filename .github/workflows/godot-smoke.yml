name: Godot CI

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "tests/**"
      - "data/content/**"
      - ".github/workflows/godot-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        run: godot --version

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Run bootstrap scene headlessly
        run: godot --headless --path . --scene res://scenes/Main.tscn --quit-after 3

      - name: Run TST-01 core rules suite
        run: bash tests/run_core_suite.sh

      - name: Run BOSS-01 encounter tests
        run: godot --headless --path . --script res://tests/boss_encounter_test.gd

      - name: Run UI-01 reputation and HUD tests
        run: godot --headless --path . --script res://tests/reputation_test.gd
